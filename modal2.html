<div id="productionApp" class="wh-app">
  <style>
    /* Стили для модального окна */
    .wh-app {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .wh-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
    }

    .recipe-container {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.06);
      margin-bottom: 15px;
      position: relative;
    }

    .recipe-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }

    .recipe-header > div {
      flex-grow: 1;
    }

    .recipe-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--text);
    }

    .wh-field {
      margin-bottom: 10px;
    }

    .wh-field label {
      display: block;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .wh-row-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }

    textarea.wh-row-input {
      resize: vertical;
    }

    .recipe-image-upload {
      position: absolute;
      right: 10px;
      top: 50px;
      width: 300px;
      height: 400px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background-color: #f9f9f9;
    }

    .recipe-image-upload img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .add-recipe-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-recipe-btn {
      background: #f44336;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      align-self: flex-start;
      margin-top: 15px;
    }

    .material-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 8px;
      background-color: #f9f9f9;
    }

    .material-info {
      flex-grow: 1;
    }

    .material-name {
      font-weight: bold;
    }

    .material-details {
      font-size: 12px;
      color: #666;
    }

    .recipe-materials-section {
      margin-top: 15px;
    }

    .material-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .material-select {
      flex-grow: 1;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .add-material-btn {
      background: #2196F3;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>

    ];

    let recipeCounter = 0;

    // Логика переключения вкладок
    const tabs = document.querySelectorAll('.wh-tab');
    const panels = {
      recipes: document.getElementById('panel-recipes'),
      'production-tasks': document.getElementById('panel-production-tasks')
    };

    function setActiveTab(key) {
      tabs.forEach(t => {
        const on = t.dataset.tab === key;
        t.checked = on;
        t.setAttribute("aria-selected", on ? "true" : "false");
      });

      Object.entries(panels).forEach(([k, el]) => {
        if (!el) return;
        el.classList.toggle("active", k === key);
      });
    }

    tabs.forEach(btn => {
      btn.addEventListener("change", () => setActiveTab(btn.dataset.tab));
    });

    document.getElementById('addRecipeBtn').addEventListener('click', function() {
      addRecipeContainer();
    });

    function addRecipeContainer() {
      recipeCounter++;
      const containerId = `recipe_${recipeCounter}`;

      const container = document.createElement('div');
      container.className = 'recipe-container';
      container.id = containerId;

      container.innerHTML = `
        <div class="recipe-header">
          <div>
            <div class="wh-field">
              <label>Артикул продукта</label>
              <input type="text" class="wh-row-input" placeholder="Введите артикул...">
            </div>
            <div class="wh-field">
              <label>Название продукта</label>
              <input type="text" class="wh-row-input" placeholder="Введите название...">
            </div>
          </div>
          <button class="remove-recipe-btn" onclick="removeRecipe('${containerId}')">Удалить</button>
        </div>

        <div class="recipe-form">
          <div class="wh-field">
            <label>Описание продукта</label>
            <textarea class="wh-row-input" rows="4" placeholder="Введите описание..."></textarea>
          </div>

          <div class="recipe-materials-section">
            <label>Материалы:</label>
            <div class="material-controls">
              <select class="material-select" onchange="filterMaterials(this)">
                <option value="">Поиск материала...</option>
                ${warehouseData.map(material =>
                  `<option value="${material.id}">${material.sku} - ${material.item_name} (${material.category}) - ${material.unit_price} руб.</option>`
                ).join('')}
              </select>
              <button class="add-material-btn" onclick="addMaterialToRecipe('${containerId}')">Добавить материал</button>
            </div>
            <div class="selected-materials" id="selectedMaterials_${recipeCounter}">
              <div id="materialsList_${recipeCounter}"></div>
            </div>
          </div>
        </div>

        <div class="recipe-image-upload" id="imageUpload_${recipeCounter}_container">
          <input type="file" id="imageUpload_${recipeCounter}" accept="image/*" onchange="previewImage(this, 'imageUpload_${recipeCounter}_container')" style="display: none;">
          <div onclick="document.getElementById('imageUpload_${recipeCounter}').click()" style="cursor: pointer; text-align: center;">
            <span>+</span>
            <p>Загрузить изображение</p>
          </div>
        </div>
      `;

      document.getElementById('recipesContainer').appendChild(container);
    }

    function removeRecipe(containerId) {
      const element = document.getElementById(containerId);
      if(element) {
        element.remove();
      }
    }

    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      const file = input.files[0];

      if(file) {
        const reader = new FileReader();

        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" alt="Предпросмотр изображения">`;
        }

        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = '<span>+</span><p>Загрузить изображение</p>';
      }
    }

    // Функции для работы с материалами
    function filterMaterials(selectElement) {

    }

    function addMaterialToRecipe(containerId) {
      const container = document.getElementById(containerId);
      const selectElement = container.querySelector('.material-select');
      const selectedValue = selectElement.value;

      if(!selectedValue) {
        alert('Пожалуйста, выберите материал для добавления');
        return;
      }

      const materialData = warehouseData.find(item => item.id === selectedValue);

      if(materialData) {
        const materialsListId = container.querySelector('[id*="materialsList_"]').id;
        const materialsList = document.getElementById(materialsListId);

        // Создаем элемент для отображения выбранного материала
        const materialItem = document.createElement('div');
        materialItem.className = 'material-item';
        materialItem.innerHTML = `
          <div class="material-info">
            <div class="material-name">${materialData.item_name}</div>
            <div class="material-details">Артикул: ${materialData.sku}, Категория: ${materialData.category}, Цена: ${materialData.unit_price} руб.</div>
          </div>
          <button onclick="removeMaterialFromRecipeNew('${materialsListId}', '${materialData.id}')" style="background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 12px;">Убрать</button>
        `;

        materialsList.appendChild(materialItem);
      }
    }

    function removeMaterialFromRecipeNew(materialsListId, materialId) {
      const materialsList = document.getElementById(materialsListId);
      const materialItems = materialsList.querySelectorAll('.material-item');

      for (let i = 0; i < materialItems.length; i++) {
        const item = materialItems[i];
        if (item.innerHTML.includes(materialId)) {
          item.remove();
          break;
        }
      }
    }

    // Инициализация: добавляем первый контейнер
    window.addEventListener('DOMContentLoaded', function() {
      addRecipeContainer();
    });
