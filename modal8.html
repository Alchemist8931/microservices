<div class="helper" style="color: var(--text); font-weight: 600;">Управление пользователями</div>
<p class="helper" style="color: var(--text); margin-top: 6px;">Создание и управление пользователями сервиса вашей рабочей группы. </p>

<div class="users-management">
    <div class="section">
        <h3>Создать нового пользователя</h3>
        <form id="create-user-form">
            <div class="input-group">
                <label for="username">Имя пользователя (email):</label>
                <input type="email" id="username" required placeholder="user@example.com">
            </div>
            <div class="input-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required placeholder="Введите пароль">
            </div>
            <div class="input-group">
                <label for="confirm-password">Подтвердите пароль:</label>
                <input type="password" id="confirm-password" required placeholder="Повторите пароль">
            </div>
            <button type="submit">Создать пользователя</button>
        </form>
    </div>

    <div class="section">
        <h3>Список пользователей группы</h3>
        <div id="users-list">
            <!-- Список пользователей будет загружен здесь -->
        </div>
    </div>
</div>

<style>
    .users-management {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
    }

    .section {
        margin-bottom: 30px;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
    }

    .section h3 {
        margin-top: 0;
        color: var(--text);
    }

    .input-group {
        margin-bottom: 15px;
    }

    .input-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: var(--text);
    }

    .input-group input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .input-group input:focus {
        outline: none;
        border-color: #007bff;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }

    button:hover {
        background-color: #0056b3;
    }

    .user-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 10px;
        background-color: white;
    }

    .user-info {
        flex-grow: 1;
    }

    .user-actions {
        display: flex;
        gap: 10px;
    }

    .toggle-btn {
        background-color: #28a745;
        padding: 5px 10px;
        font-size: 12px;
    }

    .toggle-btn.inactive {
        background-color: #dc3545;
    }

    .delete-btn {
        background-color: #dc3545;
        padding: 5px 10px;
        font-size: 12px;
    }

    .permissions-btn {
        background-color: #ffc107;
        color: #212529;
        padding: 5px 10px;
        font-size: 12px;
    }
</style>

<script>
    (function() {
        const SUPABASE_URL = "https://ncdwlmgwljjwpuawlssr.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZHdsbWd3bGpqd3B1YXdsc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NTQxNDksImV4cCI6MjA4MzAzMDE0OX0.rrIznUflWydylTnUZvOxOkeF9eMp91qNN4Bjq2gXRL8";
        const supabaseClient = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const createUserForm = document.getElementById('create-user-form');

                               if (createUserForm) {
            createUserForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (password !== confirmPassword) {
                    alert('Пароли не совпадают');
                    return;
                }

                try {
                    // 1. Явно получаем сессию
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    
                    if (!session) {
                        throw new Error("Сессия не найдена. Пожалуйста, перезайдите в систему.");
                    }

                    // 2. Вызываем функцию с ЯВНЫМ заголовком Authorization
                    const { data, error } = await supabaseClient.functions.invoke('create-user', {
                        body: { 
                            email: username, 
                            password: password 
                        },
                        headers: {
                            // Мы вручную вставляем токен в заголовок
                            Authorization: `Bearer ${session.access_token}`
                        }
                    });

                    if (error) {
                        // Улучшенная обработка ошибок
                        let msg = error.message;
                        if (error.context) {
                             try {
                                const errBody = await error.context.json();
                                if (errBody.error) msg = errBody.error;
                             } catch {}
                        }
                        throw new Error(msg);
                    }

                    alert('Пользователь успешно создан');
                    document.getElementById('create-user-form').reset();
                    loadUsersList(); 
                } catch (error) {
                    console.error('Ошибка:', error);
                    alert('Ошибка при создании: ' + error.message);
                }
            });
        }

        // Загрузка списка пользователей
        async function loadUsersList() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) throw new Error('Вы не авторизованы');

                const { data: adminInfo, error: adminError } = await supabaseClient
                    .from('app_users')
                    .select('group_key, role')
                    .eq('user_id', user.id)
                    .single();

                if (adminError || !adminInfo || adminInfo.role !== 'admin') {
                    throw new Error('Доступ запрещен');
                }

                const { data: users, error: usersError } = await supabaseClient
                    .from('app_users')
                    .select('user_id, username, role, enabled, page_unlock')
                    .eq('group_key', adminInfo.group_key)
                    .neq('role', 'admin');

                if (usersError) throw usersError;

                const usersList = document.getElementById('users-list');
                usersList.innerHTML = '';

                if (users && users.length > 0) {
                    users.forEach(user => {
                        const userItem = document.createElement('div');
                        userItem.className = 'user-item';
                        userItem.innerHTML = `
                            <div class="user-info">
                                <strong>${user.username}</strong><br>
                                <small>ID: ${user.user_id}</small><br>
                                <small>Доступ: ${user.page_unlock || 'Нет'}</small>
                            </div>
                            <div class="user-actions">
                                <button class="toggle-btn ${!user.enabled ? 'inactive' : ''}" onclick="toggleUserStatus('${user.user_id}', ${user.enabled})">${user.enabled ? 'Активен' : 'Неактивен'}</button>
                                <button class="permissions-btn" onclick="editUserPermissions('${user.user_id}', '${user.page_unlock || ''}')">Права</button>
                                <button class="delete-btn" onclick="deleteUser('${user.user_id}')">Удалить</button>
                            </div>
                        `;
                        usersList.appendChild(userItem);
                    });
                } else {
                    usersList.innerHTML = '<p>Нет пользователей.</p>';
                }
            } catch (error) {
                console.error('Ошибка загрузки списка:', error);
                document.getElementById('users-list').innerHTML = '<p>Ошибка: ' + error.message + '</p>';
            }
        }

        window.toggleUserStatus = async function(userId, currentStatus) {
            try {
                const { error } = await supabaseClient.from('app_users').update({ enabled: !currentStatus }).eq('user_id', userId);
                if (error) throw error;
                loadUsersList();
            } catch (error) { alert(error.message); }
        };

        window.deleteUser = async function(userId) {
            if (!confirm('Удалить пользователя из таблицы?')) return;
            try {
                const { error } = await supabaseClient.from('app_users').delete().eq('user_id', userId);
                if (error) throw error;
                loadUsersList();
            } catch (error) { alert(error.message); }
        };

        window.editUserPermissions = function(userId, currentPermissions) {
            const newPermissions = prompt('Группы (Group1,Group2):', currentPermissions);
            if (newPermissions !== null) {
                (async () => {
                    const { error } = await supabaseClient.from('app_users').update({ page_unlock: newPermissions }).eq('user_id', userId);
                    if (error) alert(error.message); else loadUsersList();
                })();
            }
        };

        loadUsersList();
    })();
</script>
