<div class="helper" style="color: var(--text); font-weight: 600;">Раздел 4 - Загрузка PDF файлов</div>
<p class="helper" style="color: var(--text); margin-top: 6px;">Загружайте финансовую отчетность (PDF). Конвертация в изображения происходит на вашем устройстве.</p>

<div class="upload-container">
    <div class="file-input-wrapper">
        <input type="file" id="pdf-file" name="pdf-file" accept=".pdf" />
        <label for="pdf-file">Выберите PDF файл</label>
    </div>

    <div id="progress-container" style="margin-top: 15px; display: none;">
        <div style="background: #eee; border-radius: 4px; overflow: hidden;">
            <div id="progress-bar" style="width: 0%; height: 20px; background: #28a745; text-align: center; color: white; font-size: 12px; transition: width 0.3s;"></div>
        </div>
        <p id="progress-text" style="font-size: 12px; color: #666; margin-top: 5px;">Подготовка...</p>
    </div>

    <div id="upload-status"></div>

    <table id="files-table" class="files-table">
        <thead>
            <tr>
                <th>Дата и время</th>
                <th>Пользователь</th>
                <th>Имя файла</th>
                <th>Размер (МБ)</th>
                <th>Статус</th>
                <th>Excel</th>
            </tr>
        </thead>
        <tbody id="files-table-body"></tbody>
    </table>
</div>

<style>
    .upload-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .file-input-wrapper { margin-bottom: 10px; }
    .file-input-wrapper input[type="file"] { display: none; }
    .file-input-wrapper label {
        display: inline-block; padding: 10px 20px; background-color: #007bff;
        color: white; border-radius: 4px; cursor: pointer; font-weight: 600;
    }
    .file-input-wrapper label:hover { background-color: #0056b3; }
    .files-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .files-table th, .files-table td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    .files-table th { background-color: #f2f2f2; }
    button { padding: 5px 10px; background-color: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
    button:hover { background-color: #138496; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
</style>

<script>
    (function() {
        const STATUS_DIV = document.getElementById('upload-status');
        
        function loadScript(url) {
            return new Promise((resolve, reject) => {
                if (window.pdfjsLib) return resolve();
                const script = document.createElement('script');
                script.src = url;
                script.onload = () => resolve();
                script.onerror = () => reject(new Error(`Failed to load script ${url}`));
                document.head.appendChild(script);
            });
        }

        loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js')
            .then(() => {
                console.log("PDF.js loaded successfully");
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                initUploader();
            })
            .catch(err => {
                STATUS_DIV.innerHTML = '<p style="color: red;">Ошибка загрузки библиотеки PDF.js: ' + err.message + '</p>';
            });

        function initUploader() {
            const SUPABASE_URL = "https://ncdwlmgwljjwpuawlssr.supabase.co";
            const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZHdsbWd3bGpqd3B1YXdsc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NTQxNDksImV4cCI6MjA4MzAzMDE0OX0.rrIznUflWydylTnUZvOxOkeF9eMp91qNN4Bjq2gXRL8";
            const supabaseClient = window.supabaseClient || supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const fileInput = document.getElementById('pdf-file');
            const tableBody = document.getElementById('files-table-body');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');

            loadExistingFiles();

            fileInput.addEventListener('change', async function(e) {
                if (!fileInput.files.length) return;
                const file = fileInput.files[0];

                if (file.type !== 'application/pdf') {
                    STATUS_DIV.innerHTML = '<p style="color: red;">Только PDF файлы</p>';
                    return;
                }

                const { data: { user } } = await supabaseClient.auth.getUser();
                if (!user) {
                    STATUS_DIV.innerHTML = '<p style="color: red;">Ошибка: Вы не авторизованы.</p>';
                    return;
                }

                STATUS_DIV.innerHTML = '';
                progressContainer.style.display = 'block';
                progressBar.style.width = '0%';
                progressText.innerText = 'Подготовка...';
                fileInput.disabled = true;

                try {
                    const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);

                    // 1. Создаем запись
                    const { data: record, error: dbErr } = await supabaseClient
                        .from('pdf_uploads')
                        .insert([{
                            user_login: user.email,
                            file_name: file.name,
                            file_size_mb: parseFloat(fileSizeMB),
                            upload_status: 'сохранение файла',
                            processing_status: 'задача в работе'
                        }])
                        .select().single();
                    
                    if (dbErr) throw dbErr;
                    const recordId = record.id;

                    // 2. Конвертируем
                    const imagePaths = await convertPdfToImages(file, recordId, user.email, (progress, text) => {
                        progressBar.style.width = `${progress}%`;
                        progressText.innerText = text;
                    });

                    progressText.innerText = 'Отправка задачи в AI...';
                    progressBar.style.width = '90%';

                    // 3. Вызываем функцию
                    const funcRes = await supabaseClient.functions.invoke('pdf-processor', {
                        body: { 
                            record_id: recordId, 
                            image_paths: imagePaths 
                        }
                    });

                    if (funcRes.error) throw new Error(funcRes.error.message);

                    // УБРАЛИ ЛИШНЕЕ ОБНОВЛЕНИЕ ЗДЕСЬ. Бэкенд сам обновит статус на "выполнено" когда все чанки придут.
                    
                    STATUS_DIV.innerHTML = '<p style="color: green;">Файл отправлен в обработку. Ожидайте результата.</p>';
                    progressBar.style.width = '100%';
                    progressText.innerText = 'Ожидание обработки...';
                    
                    // Обновляем таблицу, но статус будет "задача в работе"
                    loadExistingFiles();

                } catch (err) {
                    console.error(err);
                    STATUS_DIV.innerHTML = `<p style="color: red;">Ошибка: ${err.message}</p>`;
                    progressContainer.style.display = 'none';
                } finally {
                    fileInput.disabled = false;
                    fileInput.value = '';
                }
            });

            async function convertPdfToImages(file, recordId, userEmail, onProgress) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const totalPages = pdf.numPages;
                
                const imagePaths = [];
                const baseFolder = `vision_chunks/${recordId}`;

                for (let i = 1; i <= totalPages; i++) {
                    onProgress(Math.round((i / totalPages) * 80), `Рендер страницы ${i}/${totalPages}...`);
                    
                    const page = await pdf.getPage(i);
                    const scale = 2.0;
                    const viewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    const ctx = canvas.getContext('2d');

                    await page.render({ canvasContext: ctx, viewport }).promise;
                    
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));
                    
                    const fileName = `${baseFolder}/page_${i}.jpg`;
                    
                    const { error: uploadErr } = await supabaseClient.storage
                        .from('pdf_files') 
                        .upload(fileName, blob, { 
                            contentType: 'image/jpeg',
                            upsert: true 
                        });

                    if (uploadErr) throw new Error(`Upload error page ${i}: ${uploadErr.message}`);
                    imagePaths.push(fileName);
                }
                return imagePaths;
            }

            async function loadExistingFiles() {
                const { data: files, error } = await supabaseClient
                    .from('pdf_uploads')
                    .select('*')
                    .order('upload_time', { ascending: false });

                if (error) { console.error(error); return; }
                tableBody.innerHTML = '';
                if (!files?.length) {
                    tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center">Нет записей</td></tr>';
                    return;
                }

                files.forEach(file => {
                    const row = document.createElement('tr');
                    // Показываем кнопку ТОЛЬКО если статус 'парсинг выполнен' И есть путь к файлу
                    let excelBtn = (file.processing_status === 'парсинг выполнен' && file.excel_path)
                        ? `<button onclick="window.downloadExcel('${file.excel_path}', '${file.file_name.replace('.pdf', '.xlsx')}')">Excel</button>`
                        : `<span style="color:#999; font-size:11px;">${file.processing_status || 'в процессе'}</span>`;

                    row.innerHTML = `
                        <td>${new Date(file.upload_time).toLocaleString()}</td>
                        <td>${file.user_login}</td>
                        <td>${file.file_name}</td>
                        <td>${file.file_size_mb}</td>
                        <td>${file.upload_status}</td>
                        <td>${excelBtn}</td>
                    `;
                    tableBody.appendChild(row);
                });
            }
        }
        
        window.downloadExcel = async function(path, name) {
            const supabaseClient = window.supabaseClient || supabase.createClient("https://ncdwlmgwljjwpuawlssr.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZHdsbWd3bGpqd3B1YXdsc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NTQxNDksImV4cCI6MjA4MzAzMDE0OX0.rrIznUflWydylTnUZvOxOkeF9eMp91qNN4Bjq2gXRL8");
            const { data, error } = await supabaseClient.storage.from('excel_outputs').download(path);
            if (error) return alert("Ошибка скачивания");
            const url = URL.createObjectURL(data);
            const a = document.createElement('a'); a.href = url; a.download = name; a.click(); URL.revokeObjectURL(url);
        };
    })();
</script>
