<div class="helper" style="color: var(--text); font-weight: 600;">Раздел 4 - Загрузка PDF файлов</div>
<p class="helper" style="color: var(--text); margin-top: 6px;">Загрузите PDF файлы для обработки</p>

<!-- Подключение библиотеки Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div class="upload-container">
    <div class="file-input-wrapper">
            <input type="file" id="pdf-file" name="pdf-file" accept=".pdf" />
            <label for="pdf-file">Выберите PDF файл</label>
        </div>

    <div id="upload-status"></div>

    <table id="files-table" class="files-table">
        <thead>
            <tr>
                <th>Дата и время загрузки</th>
                <th>Логин пользователя</th>
                <th>Имя файла</th>
                <th>Размер (МБ)</th>
                <th>Статус загрузки</th>
                <th>Скачать</th>
                <th>Статус обработки</th>
                <th>Скачать Excel</th>
            </tr>
        </thead>
        <tbody id="files-table-body">
            <!-- Записи будут добавляться динамически -->
        </tbody>
    </table>
</div>

<script>
    // Конфигурация Supabase
    const SUPABASE_URL = "https://ncdwlmgwljjwpuawlssr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jZHdsbWd3bGpqd3B1YXdsc3NyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc0NTQxNDksImV4cCI6MjA4MzAzMDE0OX0.rrIznUflWydylTnUZvOxOkeF9eMp91qNN4Bjq2gXRL8";

    // Инициализация Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Получаем элементы (они уже есть на странице, так как скрипт идет после HTML)
    const fileInput = document.getElementById('pdf-file');
    const statusDiv = document.getElementById('upload-status');
    const tableBody = document.getElementById('files-table-body');

    // Сразу загружаем список файлов
    loadExistingFiles();

    // Обработка выбора файла
    fileInput.addEventListener('change', async function(e) {
        console.log("File input changed:", fileInput.files);
        if (!fileInput.files.length) {
            console.log("No files selected");
            return;
        }

        const file = fileInput.files[0];
        console.log("Selected file:", file);

        if (file.type !== 'application/pdf') {
            statusDiv.innerHTML = '<p style="color: red;">Можно загружать только PDF файлы</p>';
            fileInput.value = '';
            return;
        }

        statusDiv.innerHTML = '<p style="color: blue;">Проверка авторизации и загрузка...</p>';

        try {
            // ВАЖНО: Проверяем, авторизован ли пользователь
            const { data: { user } } = await supabaseClient.auth.getUser();
            
            // Если пользователя нет, политика 'authenticated' не сработает.
            // Нужно либо требовать логин, либо менять политики в Supabase.
            if (!user) {
                // Для теста можно использовать 'test_user', но в Storage Policy это не пройдет, 
                // если там указано 'TO authenticated'.
                // Временное решение для отладки:
                console.warn("Пользователь не авторизован! Загрузка может не сработать с текущими политиками Storage.");
            }

            const username = user ? user.email : 'anonymous_user';

            // Create a safe filename for storage by replacing problematic characters
const safeUsername = username.replace(/[^a-zA-Z0-9._-]/g, '_');
const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
const fileName = `${Date.now()}_${safeUsername}_${safeFileName}`;
            const uploadTime = new Date().toISOString();
            const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);

            statusDiv.innerHTML = '<p style="color: blue;">Создание записи в БД...</p>';

            // 1. Создаем запись в таблице
            const { data: uploadRecord, error: insertError } = await supabaseClient
                .from('pdf_uploads')
                .insert([
                    {
                        upload_time: uploadTime,
                        user_login: username,
                        file_name: file.name,
                        file_size_mb: parseFloat(fileSizeMB),
                        upload_status: 'сохранение файла',
                        processing_status: 'задача в работе'
                    }
                ])
                .select()
                .single(); // Используем single, чтобы получить объект, а не массив

            if (insertError) {
                console.error("Insert error:", insertError);
                throw new Error(`Ошибка БД: ${insertError.message}`);
            }

            const recordId = uploadRecord.id;
            console.log("Database record created:", recordId);

            statusDiv.innerHTML = '<p style="color: blue;">Загрузка файла в хранилище...</p>';

            // 2. Загружаем файл в Storage
            const { data: storageData, error: storageError } = await supabaseClient
                .storage
                .from('pdf_files')
                .upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (storageError) {
                console.error("Storage error:", storageError);
                // Откатываем статус в БД, если не удалось загрузить файл
                await supabaseClient
                    .from('pdf_uploads')
                    .update({ upload_status: 'ошибка хранения', processing_status: 'ошибка' })
                    .eq('id', recordId);
                throw new Error(`Ошибка Storage: ${storageError.message}`);
            }

            console.log("File uploaded to storage:", storageData);

            // 3. Обновляем запись в БД
            await supabaseClient
                .from('pdf_uploads')
                .update({
                    upload_status: 'файл сохранен',
                    file_path: storageData.path
                })
                .eq('id', recordId);

            statusDiv.innerHTML = '<p style="color: green;">Файл успешно загружен!</p>';
            fileInput.value = '';
            loadExistingFiles();

        } catch (error) {
            console.error('Полная ошибка:', error);
            statusDiv.innerHTML = `<p style="color: red;">Ошибка: ${error.message}</p>`;
        }
    });

    // Функция загрузки списка файлов
    async function loadExistingFiles() {
        try {
            const { data: files, error } = await supabaseClient
                .from('pdf_uploads')
                .select('*')
                .order('upload_time', { ascending: false });

            if (error) throw error;

            tableBody.innerHTML = '';

            if (!files || files.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center">Нет загруженных файлов</td></tr>';
                return;
            }

            files.forEach(file => {
                const row = document.createElement('tr');
                let downloadButton = file.file_path 
                    ? `<button onclick="downloadFile('${file.file_path}', '${file.file_name}')">Скачать PDF</button>` 
                    : '-';
                
                let excelButton = (file.processing_status === 'парсинг выполнен' && file.excel_path) 
                    ? `<button onclick="downloadExcel('${file.excel_path}', '${file.file_name.replace('.pdf', '.xlsx')}')">Скачать Excel</button>` 
                    : '-';

                row.innerHTML = `
                    <td>${new Date(file.upload_time).toLocaleString()}</td>
                    <td>${file.user_login}</td>
                    <td>${file.file_name}</td>
                    <td>${file.file_size_mb} МБ</td>
                    <td>${file.upload_status}</td>
                    <td>${downloadButton}</td>
                    <td>${file.processing_status}</td>
                    <td>${excelButton}</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Ошибка при загрузке списка:', error);
        }
    }

    // Глобальные функции для скачивания
    window.downloadFile = async function(filePath, fileName) {
        try {
            const { data, error } = await supabaseClient.storage.from('pdf_files').download(filePath);
            if (error) throw error;
            const url = URL.createObjectURL(data);
            const a = document.createElement('a');
            a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (error) {
            console.error('Ошибка скачивания:', error);
            alert('Ошибка при скачивании файла: ' + error.message);
        }
    };

    window.downloadExcel = async function(excelPath, fileName) {
        try {
            const { data, error } = await supabaseClient.storage.from('excel_outputs').download(excelPath);
            if (error) throw error;
            const url = URL.createObjectURL(data);
            const a = document.createElement('a');
            a.href = url; a.download = fileName; document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (error) {
            console.error('Ошибка скачивания Excel:', error);
            alert('Ошибка при скачивании Excel: ' + error.message);
        }
    };
</script>
